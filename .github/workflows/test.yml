name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          for f in scripts/*.sh tests/run-tests.sh tests/mock/VBoxManage; do
            bash -n "$f"
          done

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --version
          shellcheck -S style scripts/*.sh tests/run-tests.sh tests/mock/VBoxManage

      - name: Validate presets
        run: ./scripts/validate-presets.sh

      - name: Validate ISO catalog
        run: ./scripts/validate-catalog.sh

      - name: Test suite
        shell: bash
        run: |
          set +e
          ./tests/run-tests.sh > tests.log 2>&1
          rc=$?
          cat tests.log
          if [ "$rc" -ne 0 ]; then
            # Surface the failure in the check run annotations as well.
            grep -E '^✗|^  ✗|^Failed:|^  - ' tests.log | head -n 8 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$rc"

      - name: Dry run without VirtualBox
        run: ./scripts/create-vm.sh --iso none --preset dev --dry-run
