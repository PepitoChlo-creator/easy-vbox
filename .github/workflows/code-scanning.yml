name: Code scanning

# Bridges ShellCheck (already used by CI) into GitHub code scanning, since
# EasyVbox is pure bash and CodeQL does not analyse shell scripts. Findings
# are published as code scanning alerts without failing the build.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (upload SARIF)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required to publish code scanning results
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck -> SARIF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck || true
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --format sarif \
              scripts/*.sh tests/run-tests.sh tests/mock/VBoxManage \
              > shellcheck.sarif || true
          fi
          # Guarantee a valid (possibly empty) SARIF so upload never chokes.
          if [ ! -s shellcheck.sarif ]; then
            cat > shellcheck.sarif <<'SARIF'
          {
            "version": "2.1.0",
            "runs": [
              {
                "tool": { "driver": { "name": "ShellCheck" } },
                "results": []
              }
            ]
          }
          SARIF
          fi

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: shellcheck.sarif
          category: shellcheck
