name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag matches the script version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          script_version="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' scripts/create-vm.sh | head -n1)"
          echo "tag=$tag_version script=$script_version"
          if [ "$tag_version" != "$script_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION=$script_version in create-vm.sh"
            exit 1
          fi

      - name: Run the test suite before shipping
        run: ./tests/run-tests.sh

      - name: Build the tarball
        run: |
          name="easy-vbox-${GITHUB_REF_NAME#v}"
          mkdir -p "dist/$name"
          cp -R README.md CHANGELOG.md CONTRIBUTING.md LICENSE Makefile docs presets scripts tests "dist/$name/"
          find "dist/$name" -name '*.sh' -o -name 'VBoxManage' -o -name 'run-tests.sh' | xargs chmod +x
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          cat "dist/$name.tar.gz.sha256"

      - name: Build the release notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between "## [version]" and the next "## [" heading.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "notes_source=changelog" >> "$GITHUB_ENV"
            { printf "## What's included\n"; cat release-notes.md; } >> release-notes.md.tmp
            mv release-notes.md.tmp release-notes.md
          else
            echo "notes_source=generated" >> "$GITHUB_ENV"
            echo "No CHANGELOG section for $version; GitHub will generate the notes."
          fi
          head -20 release-notes.md || true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="dist/easy-vbox-${GITHUB_REF_NAME#v}.tar.gz"
          checksum="$asset.sha256"
          if [ "$notes_source" = "changelog" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "EasyVbox ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              "$asset" "$checksum"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "EasyVbox ${GITHUB_REF_NAME}" \
              --generate-notes \
              "$asset" "$checksum"
          fi
