version: 2

# EasyVbox has no runtime dependencies — nothing to bump but the Actions it
# runs on. This keeps the workflows from rotting on deprecated runtimes.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
